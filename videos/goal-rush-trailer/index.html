<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Saira Condensed"; font-weight: 700; src: url("assets/fonts/font-S7.woff2") format("woff2"); }
      @font-face { font-family: "Saira Condensed"; font-weight: 800; src: url("assets/fonts/font-S8.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 500; src: url("assets/fonts/font-B5.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/font-B7.woff2") format("woff2"); }
      :root {
        --ink: #060a13;
        --white: #eaf1ff;
        --lime: #b8ff3b;
        --cyan: #38d6ff;
        --blue: #1a5fe8;
        --mut: #9fb0cc;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); font-family: "Barlow", sans-serif; color: var(--white); }
      .layer { position: absolute; inset: 0; }
      #stage { position: absolute; inset: -40px; }
      .shot { position: absolute; inset: 40px; width: 1080px; height: 1920px; object-fit: cover; }
      .blurbg { filter: blur(26px) brightness(0.5) saturate(1.1); }
      #grade { background-color: rgba(6, 10, 19, 0.15); }
      #vignette { background: radial-gradient(ellipse 85% 65% at 50% 50%, rgba(6, 10, 19, 0) 40%, rgba(6, 10, 19, 0.9) 100%); }
      #hudmask { bottom: auto; height: 140px; background: linear-gradient(to bottom, rgba(6, 10, 19, 0.95) 45%, rgba(6, 10, 19, 0)); }
      #flash { background: #ffffff; opacity: 0; }
      #lflash { background: var(--lime); opacity: 0; mix-blend-mode: screen; }

      /* upright condensed — the UFL card voice */
      .P { font-family: "Saira Condensed", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 0.84; letter-spacing: 0.02em; white-space: nowrap; }
      .X { font-family: "Barlow", sans-serif; font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
      .K { font-family: "Saira Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.32em; font-size: 34px; }

      /* the flag: ink satin with a lime corner, built from gradients */
      #cloth { overflow: hidden; }
      #cloth .fab {
        position: absolute; inset: -30%;
        background:
          radial-gradient(ellipse 28% 55% at 30% 38%, rgba(150, 175, 215, 0.16), rgba(0, 0, 0, 0) 70%),
          radial-gradient(ellipse 22% 70% at 74% 62%, rgba(150, 175, 215, 0.12), rgba(0, 0, 0, 0) 70%),
          repeating-linear-gradient(112deg, rgba(0, 0, 0, 0) 0px, rgba(190, 210, 240, 0.07) 140px, rgba(0, 0, 0, 0) 210px, rgba(0, 0, 0, 0.3) 280px, rgba(0, 0, 0, 0) 360px),
          linear-gradient(160deg, #0c1526, #05080f 45%, #0e1829 70%, #04070c);
      }
      #cloth .sheen { position: absolute; inset: -20%; background: linear-gradient(105deg, rgba(0, 0, 0, 0) 38%, rgba(234, 241, 255, 0.13) 47%, rgba(0, 0, 0, 0) 56%); background-size: 300% 100%; }
      #cloth .band { position: absolute; left: -45%; width: 190%; transform-origin: 50% 50%; }
      #cloth .bl { top: 1560px; height: 300px; background: linear-gradient(180deg, #1d2f07 0%, #79b21f 16%, #b8ff3b 34%, #efffd0 50%, #b8ff3b 63%, #5d8c16 86%, #18270a 100%); box-shadow: 0 -40px 90px rgba(0, 0, 0, 0.7); }
      #cloth .bw { top: -150px; height: 230px; background: linear-gradient(180deg, #2a313d 0%, #8c96a8 25%, #e4eaf4 50%, #97a1b2 72%, #262c37 100%); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7); }
      #cloth .edge { position: absolute; top: 0; bottom: 0; width: 70px; background: linear-gradient(90deg, rgba(234, 241, 255, 0), rgba(234, 241, 255, 0.4), rgba(234, 241, 255, 0)); }
      #cloth .e1 { left: -35px; }
      #cloth .e2 { right: -35px; }

      /* cards */
      .cc { display: flex; align-items: center; justify-content: center; }
      .A { flex-direction: column; gap: 18px; padding-bottom: 140px; }
      .A .pl { font-size: 270px; }
      .A .rsw { overflow: hidden; padding: 6px 0; }
      .A .rs { font-size: 140px; }
      .B { gap: 34px; padding-bottom: 140px; }
      .B .pl { font-size: 240px; }
      .B .win { position: relative; height: 288px; width: 470px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.28) 30%, #000 36%, #000 64%, rgba(0, 0, 0, 0.28) 70%); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.28) 30%, #000 36%, #000 64%, rgba(0, 0, 0, 0.28) 70%); }
      .B .col { position: absolute; left: 0; top: 0; }
      .B .col span { display: block; height: 96px; line-height: 96px; font-size: 60px; }
      .C { padding-bottom: 140px; }
      .C .ln { font-size: 160px; }
      #why { padding-bottom: 260px; }
      #why .ln { font-size: 180px; text-shadow: 0 10px 60px rgba(6, 10, 19, 0.8); }

      /* menu cards */
      .menu { display: flex; align-items: center; justify-content: center; }
      .menu .card { border-radius: 18px; overflow: hidden; box-shadow: 0 50px 140px rgba(0, 0, 0, 0.8); border: 2px solid rgba(234, 241, 255, 0.35); }
      .menu .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .menu .pt { width: 660px; height: 770px; }
      .menu .ls { width: 1000px; height: 562px; }

      /* end card */
      #e-art { position: absolute; left: 0; top: 380px; width: 1080px; height: 720px; object-fit: cover; -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 18%, #000 80%, rgba(0, 0, 0, 0) 100%); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 18%, #000 80%, rgba(0, 0, 0, 0) 100%); }
      #e-tag { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; }
      #e-tag .K { font-size: 40px; }
      .playbtn {
        position: absolute; left: 190px; top: 1240px; width: 700px; height: 150px; border-radius: 18px;
        background: var(--blue); color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 28px;
        box-shadow: 0 0 0 4px var(--cyan), 0 24px 80px rgba(26, 95, 232, 0.6);
      }
      .playbtn .P { font-size: 110px; font-style: italic; }
      .playbtn svg { width: 70px; height: 70px; }
      #e-foot { position: absolute; left: 0; right: 0; top: 1450px; text-align: center; color: var(--white); }
      #e-foot .K { font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="stage">
        <!-- cold open: tunnel, empty stadium, the player and the ball -->
        <img id="i-tunnel" class="clip shot" src="assets/img/loading.webp" alt="" data-start="0" data-duration="2" data-track-index="0" />
        <img id="i-stadium" class="clip shot" src="assets/img/stadium.webp" alt="" data-start="2" data-duration="2" data-track-index="0" />
        <img id="i-lobby" class="clip shot" src="assets/img/lobby.webp" alt="" data-start="4" data-duration="2" data-track-index="0" />
        <!-- 7v7 -->
        <video id="s01" class="clip shot" src="assets/clips/match.mp4" muted playsinline data-start="7.3" data-duration="1.35" data-media-start="5.000" data-track-index="0"></video>
        <video id="s02" class="clip shot" src="assets/clips/attack.mp4" muted playsinline data-start="8.65" data-duration="1.35" data-media-start="1.000" data-track-index="0"></video>
        <!-- nutmegs -->
        <video id="s03" class="clip shot" src="assets/clips/play.mp4" muted playsinline data-start="11.3" data-duration="1.35" data-media-start="4.500" data-track-index="0"></video>
        <video id="s04" class="clip shot" src="assets/clips/match.mp4" muted playsinline data-start="12.65" data-duration="1.35" data-media-start="39.500" data-track-index="0"></video>
        <!-- gegenpressing -->
        <video id="s05" class="clip shot" src="assets/clips/match.mp4" muted playsinline data-start="15.3" data-duration="1.35" data-media-start="20.400" data-track-index="0"></video>
        <video id="s06" class="clip shot" src="assets/clips/play.mp4" muted playsinline data-start="16.65" data-duration="1.35" data-media-start="8.600" data-track-index="0"></video>
        <!-- to shoot -->
        <video id="s07" class="clip shot" src="assets/clips/shot.mp4" muted playsinline data-start="19.3" data-duration="2.7" data-media-start="1.000" data-track-index="0"></video>
        <!-- ranked / online, drip, cup: menu cards over blurred play -->
        <video id="s08" class="clip shot blurbg" src="assets/clips/match.mp4" muted playsinline data-start="23.3" data-duration="10.7" data-media-start="63.800" data-track-index="0"></video>
        <!-- last attack, goal, celebration -->
        <video id="s09" class="clip shot" src="assets/clips/attack.mp4" muted playsinline data-start="34" data-duration="4" data-media-start="5.170" data-track-index="0"></video>
        <video id="s10" class="clip shot" src="assets/clips/goal.mp4" muted playsinline data-start="38" data-duration="1.6" data-media-start="0.000" data-playback-rate="0.5" data-track-index="0"></video>
        <video id="s11" class="clip shot" src="assets/clips/goal.mp4" muted playsinline data-start="39.6" data-duration="2.4" data-media-start="4.000" data-track-index="0"></video>
        <video id="s12" class="clip shot" src="assets/clips/goal.mp4" muted playsinline data-start="43.3" data-duration="2.7" data-media-start="5.750" data-track-index="0"></video>
        <!-- breath: back to the player and the ball -->
        <img id="i-lobby2" class="clip shot" src="assets/img/lobby.webp" alt="" data-start="46" data-duration="2" data-track-index="0" />
      </div>

      <div id="grade" class="clip layer" data-start="0" data-duration="60" data-track-index="1"></div>
      <div id="vignette" class="clip layer" data-start="0" data-duration="60" data-track-index="2"></div>
      <div id="hudmask" class="clip layer" data-start="7.3" data-duration="38.7" data-track-index="2"></div>

      <div id="menus" class="clip layer" data-start="23.3" data-duration="10.7" data-track-index="3">
        <div id="m1" class="menu layer"><div class="card pt"><img src="assets/img/mRanked.webp" alt="" /></div></div>
        <div id="m2" class="menu layer"><div class="card pt"><img src="assets/img/mFriends.webp" alt="" /></div></div>
        <div id="m3" class="menu layer"><div class="card ls"><img src="assets/menus/m4-shop.jpg" alt="" /></div></div>
        <div id="m4" class="menu layer"><div class="card ls"><img src="assets/menus/m6-custom.jpg" alt="" /></div></div>
        <div id="m5" class="menu layer"><div class="card pt"><img src="assets/img/mTour.webp" alt="" /></div></div>
        <div id="m6" class="menu layer"><div class="card ls"><img src="assets/menus/m7-trophies.jpg" alt="" /></div></div>
      </div>

      <div id="why" class="clip layer cc C" data-start="2" data-duration="3.6" data-track-index="3"><div class="ln P">why we play</div></div>

      <div id="cloth" class="clip layer" data-start="5.7" data-duration="54.3" data-track-index="4" data-layout-allow-overflow>
        <div class="fab"></div>
        <div class="sheen"></div>
        <div class="band bw"></div>
        <div class="band bl"></div>
        <div class="edge e1"></div>
        <div class="edge e2"></div>
      </div>

      <div id="cards" class="clip layer" data-start="6" data-duration="44" data-track-index="5" data-layout-allow-overflow>
        <div id="c1" class="layer cc C"><div class="ln P">play 7v7</div></div>
        <div id="c2" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">7v7</span><span class="X">for nutmegs</span><span class="X">to tackle</span></div></div></div>
        <div id="c3" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">gegenpressing</div></div></div>
        <div id="c4" class="layer cc C"><div class="ln P">play to shoot</div></div>
        <div id="c5" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">to shoot</span><span class="X">ranked</span><span class="X">online</span></div></div></div>
        <div id="c6" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">for the drip</div></div></div>
        <div id="c7" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">for the drip</span><span class="X">for the cup</span><span class="X">for glory</span></div></div></div>
        <div id="c8" class="layer cc C"><div class="ln P" style="font-size: 140px">play for glory</div></div>
        <div id="c9" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">for football</div></div></div>
      </div>

      <div id="end" class="clip layer" data-start="50" data-duration="10" data-track-index="5">
        <img id="e-art" src="assets/img/hero.webp" alt="" />
        <div id="e-tag"><div class="K">compete. score. dominate.</div></div>
        <div id="e-btn" class="playbtn"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#ffffff" /></svg><div class="P">play</div></div>
        <div id="e-foot"><div class="K">7v7 · season 01 · in your browser</div></div>
      </div>

      <div id="flash" class="clip layer" data-start="0" data-duration="60" data-track-index="6"></div>
      <div id="lflash" class="clip layer" data-start="37" data-duration="3" data-track-index="6"></div>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="60" data-track-index="7" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // tracking moves as per-glyph x offsets, never as letter-spacing
      function glyphs(sel) {
        const el = document.querySelector(sel), text = el.textContent;
        el.textContent = "";
        for (const ch of text) {
          const g = document.createElement("span");
          g.style.display = "inline-block";
          g.textContent = ch === " " ? "\u00a0" : ch;
          el.appendChild(g);
        }
        return Array.from(el.children);
      }
      function track(sel, spread, t, d, ease) {
        const gs = glyphs(sel), c = (gs.length - 1) / 2;
        tl.fromTo(gs, { x: (i) => (i - c) * spread }, { x: 0, duration: d, ease: ease }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: Math.min(0.4, d), ease: "power1.out" }, t);
      }
      gsap.set("#stage", { x: 0, y: 0, scale: 1 });
      gsap.set("#cloth", { xPercent: 135 });
      gsap.set(["#c1", "#c2", "#c3", "#c4", "#c5", "#c6", "#c7", "#c8", "#c9", "#m1", "#m2", "#m3", "#m4", "#m5", "#m6"], { opacity: 0 });

      // every shot is moving: slow push-in per cut
      [[7.3, 1.35], [8.65, 1.35], [11.3, 1.35], [12.65, 1.35], [15.3, 1.35], [16.65, 1.35], [19.3, 2.7], [34, 4], [38, 1.6], [39.6, 2.4], [43.3, 2.7]].forEach(([t, d]) => {
        tl.fromTo("#stage", { scale: 1 }, { scale: 1.07, duration: d, ease: "none", immediateRender: false }, t);
      });
      tl.fromTo("#i-tunnel", { scale: 1.05 }, { scale: 1.25, duration: 2, ease: "none" }, 0);
      tl.fromTo("#i-stadium", { scale: 1.15 }, { scale: 1.02, duration: 2, ease: "none" }, 2);
      tl.fromTo("#i-lobby", { scale: 1, y: 0 }, { scale: 1.14, y: -40, duration: 2, ease: "none" }, 4);
      tl.fromTo("#i-lobby2", { scale: 1.2 }, { scale: 1.05, duration: 2, ease: "none" }, 46);

      // grade: darker on stills, near-clean on gameplay
      const veil = (a) => "rgba(6, 10, 19, " + a + ")";
      tl.fromTo("#grade", { backgroundColor: veil(0.7) }, { backgroundColor: veil(0.25), duration: 2, ease: "none" }, 0);
      tl.set("#grade", { backgroundColor: veil(0.3) }, 2);
      tl.set("#grade", { backgroundColor: veil(0.12) }, 7.3);
      tl.set("#grade", { backgroundColor: veil(0.2) }, 23.3);
      tl.set("#grade", { backgroundColor: veil(0.08) }, 34);
      tl.fromTo("#grade", { backgroundColor: veil(0.08) }, { backgroundColor: veil(0.45), duration: 0.5, ease: "power2.in", immediateRender: false }, 37.5);
      tl.set("#grade", { backgroundColor: veil(0) }, 38);
      tl.set("#grade", { backgroundColor: veil(0.35) }, 46);

      // WHY WE PLAY — tracking closes in over the empty stadium
      track("#why .ln", 50, 2.1, 3.2, "power2.out");
      tl.to("#why", { opacity: 0, duration: 0.3 }, 5.3);

      // the flag waves the whole time it is on screen
      tl.fromTo("#cloth .fab", { x: -30, y: 0, rotation: -1.5, skewY: 0 }, { x: 30, y: -20, rotation: 1.5, skewY: 2, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 20 }, 5.7);
      tl.fromTo("#cloth .sheen", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 3.4, ease: "sine.inOut", yoyo: true, repeat: 15 }, 5.7);
      tl.fromTo("#cloth .bl", { rotation: -18, y: 0 }, { rotation: -13, y: -50, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 24 }, 5.7);
      tl.fromTo("#cloth .bw", { rotation: -15, y: 0 }, { rotation: -19, y: 30, duration: 2.9, ease: "sine.inOut", yoyo: true, repeat: 18 }, 5.7);

      // flag wipes: in on the bar, out to reveal the proof
      const clothIn = (t) => tl.fromTo("#cloth", { xPercent: 135, skewX: -12 }, { xPercent: 0, skewX: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t - 0.3);
      const clothOut = (t) => tl.fromTo("#cloth", { xPercent: 0, skewX: 0 }, { xPercent: -135, skewX: 12, duration: 0.3, ease: "power3.in", immediateRender: false }, t);
      [6, 10, 14, 18, 22, 26, 30, 42].forEach((t) => { clothIn(t); clothOut(t + 1.3); });
      clothIn(48);

      const show = (id, t, d) => { tl.set(id, { opacity: 1 }, t); tl.set(id, { opacity: 0 }, t + d); };

      // A — PLAY stacked over the reason
      const cardA = (id, t, d) => {
        show(id, t, d);
        tl.fromTo(id + " .pl", { scale: 1.25, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, t + 0.02);
        tl.fromTo(id + " .rs", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, t + 0.15);
        tl.to(id + " .pl", { scale: 0.96, duration: d - 0.4, ease: "none" }, t + 0.37);
      };
      // B — PLAY with the reason rolling like a slot machine
      const cardB = (id, t, d, steps) => {
        show(id, t, d);
        tl.fromTo(id + " .pl", { xPercent: -30, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, t + 0.02);
        tl.fromTo(id + " .col", { y: 96 }, { y: 96, duration: 0.01 }, t);
        steps.forEach(([at, idx]) => tl.to(id + " .col", { y: 96 * (1 - idx), duration: 0.42, ease: "expo.out" }, t + at));
      };
      // C — one line, tracking closes in
      const cardC = (id, t, d) => {
        show(id, t, d);
        track(id + " .ln", 70, t + 0.02, d - 0.1, "power3.out");
      };

      cardC("#c1", 6, 1.3);
      cardB("#c2", 10, 1.3, [[0.18, 1]]);
      cardA("#c3", 14, 1.3);
      cardC("#c4", 18, 1.3);
      cardB("#c5", 22, 1.3, [[0.15, 1], [0.75, 2]]);
      cardA("#c6", 26, 1.3);
      cardB("#c7", 30, 1.3, [[0.18, 1]]);
      cardC("#c8", 42, 1.3);
      cardA("#c9", 48, 2);
      tl.fromTo("#c9 .pl", { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 49);

      // menu cards: tilt in, drift, whip out
      [["#m1", 23.3, 1], ["#m2", 24.65, -1], ["#m3", 27.3, 1], ["#m4", 28.65, -1], ["#m5", 31.3, 1], ["#m6", 32.65, -1]].forEach(([id, t, side]) => {
        show(id, t, 1.35);
        tl.fromTo(id + " .card", { xPercent: 90 * side, rotationY: -30 * side, rotationZ: 4 * side, transformPerspective: 1600 },
          { xPercent: 0, rotationY: -8 * side, rotationZ: 0, duration: 0.35, ease: "power4.out" }, t);
        tl.to(id + " .card", { rotationY: 5 * side, scale: 1.05, duration: 0.85, ease: "none" }, t + 0.35);
        tl.to(id + " .card", { xPercent: -90 * side, duration: 0.15, ease: "power3.in" }, t + 1.2);
      });

      // impacts
      function impact(t, s) {
        tl.fromTo("#flash", { opacity: 0.85 * s }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#stage", { x: 0, y: 0 }, { immediateRender: false, keyframes: [
          { x: -26 * s, y: 18 * s, duration: 0.04 }, { x: 22 * s, y: -14 * s, duration: 0.05 },
          { x: -12 * s, y: 8 * s, duration: 0.06 }, { x: 0, y: 0, duration: 0.12 }], ease: "none" }, t);
      }
      impact(34, 0.5);
      impact(38, 1);
      tl.fromTo("#lflash", { opacity: 0.7 }, { opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 38);

      // end card on the flag
      tl.fromTo("#e-art", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 50);
      tl.to("#e-art", { scale: 1.05, duration: 9.6, ease: "none" }, 50.35);
      track("#e-tag .K", 14, 51, 1.2, "power3.out");
      tl.fromTo("#e-btn", { opacity: 0, scale: 0.6, skewX: -6 }, { opacity: 1, scale: 1, skewX: -6, duration: 0.4, ease: "back.out(2.2)" }, 52);
      for (let t = 53.5; t < 59.5; t += 1) tl.fromTo("#e-btn", { scale: 1.06 }, { scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
