<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Saira Condensed"; font-weight: 700; src: url("assets/fonts/font-S7.woff2") format("woff2"); }
      @font-face { font-family: "Saira Condensed"; font-weight: 800; src: url("assets/fonts/font-S8.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 500; src: url("assets/fonts/font-B5.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/font-B7.woff2") format("woff2"); }
      :root {
        --ink: #060a13;
        --white: #eaf1ff;
        --lime: #b8ff3b;
        --cyan: #38d6ff;
        --blue: #1a5fe8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); font-family: "Barlow", sans-serif; color: var(--white); }
      .layer { position: absolute; inset: 0; }
      #stage { position: absolute; inset: -40px; }
      .shot { position: absolute; inset: 40px; width: 1080px; height: 1920px; object-fit: cover; }
      .blurbg { filter: blur(24px) brightness(0.45) saturate(1.2); }
      #vignette { background: radial-gradient(ellipse 90% 70% at 50% 50%, rgba(6, 10, 19, 0) 58%, rgba(6, 10, 19, 0.45) 100%); }
      #scrim { background: radial-gradient(ellipse 75% 22% at 50% 46%, rgba(6, 10, 19, 0.62) 0%, rgba(6, 10, 19, 0.3) 55%, rgba(6, 10, 19, 0) 100%); opacity: 0; }
      #flash { background: #ffffff; opacity: 0; }
      #lflash { background: var(--lime); opacity: 0; mix-blend-mode: screen; }

      /* upright condensed — the UFL card voice, now over the footage */
      .P { font-family: "Saira Condensed", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 0.84; letter-spacing: 0.02em; white-space: nowrap; text-shadow: 0 6px 40px rgba(6, 10, 19, 0.7); }
      .X { font-family: "Barlow", sans-serif; font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; text-shadow: 0 4px 24px rgba(6, 10, 19, 0.8); }
      .K { font-family: "Saira Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.32em; font-size: 34px; }

      .cc { display: flex; align-items: center; justify-content: center; padding-bottom: 150px; }
      .A { flex-direction: column; gap: 14px; }
      .A .pl { font-size: 250px; }
      .A .rsw { overflow: hidden; padding: 6px 0; }
      .A .rs { font-size: 132px; }
      .B { gap: 34px; }
      .B .pl { font-size: 230px; }
      .B .win { position: relative; height: 288px; width: 540px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.3) 30%, #000 36%, #000 64%, rgba(0, 0, 0, 0.3) 70%); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.3) 30%, #000 36%, #000 64%, rgba(0, 0, 0, 0.3) 70%); }
      .B .col { position: absolute; left: 0; top: 0; }
      .B .col span { display: block; height: 96px; line-height: 96px; font-size: 52px; }
      .C .ln { font-size: 160px; }

      /* end card */
      #e-art { position: absolute; left: 0; top: 400px; width: 1080px; height: 720px; object-fit: cover; -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 16%, #000 82%, rgba(0, 0, 0, 0) 100%); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 16%, #000 82%, rgba(0, 0, 0, 0) 100%); }
      #e-tag { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; }
      #e-tag .K { font-size: 40px; }
      .playbtn {
        position: absolute; left: 190px; top: 1260px; width: 700px; height: 150px; border-radius: 18px;
        background: var(--blue); color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 28px;
        box-shadow: 0 0 0 4px var(--cyan), 0 24px 80px rgba(26, 95, 232, 0.6);
      }
      .playbtn .P { font-size: 110px; font-style: italic; text-shadow: none; }
      .playbtn svg { width: 70px; height: 70px; }
      #e-foot { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; }
      #e-foot .K { font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="stage">
        <!-- cold open: kickoff, slow orbit around the striker -->
        <video id="v00" class="clip shot" src="assets/clips4/s1-kickoff.mp4" muted playsinline data-start="0" data-duration="4" data-media-start="0" data-track-index="0"></video>
        <video id="v01" class="clip shot" src="assets/clips4/a04-drone.mp4" muted playsinline data-start="4" data-duration="2" data-media-start="0.2" data-track-index="0"></video>
        <!-- the chain: one shot per bar -->
        <video id="v02" class="clip shot" src="assets/clips4/a01-low-run.mp4" muted playsinline data-start="6" data-duration="2" data-media-start="0.1" data-track-index="0"></video>
        <video id="v03" class="clip shot" src="assets/clips4/a03-chase-run.mp4" muted playsinline data-start="8" data-duration="2" data-media-start="0.3" data-track-index="0"></video>
        <video id="v04" class="clip shot" src="assets/clips4/a09-ballcam-run.mp4" muted playsinline data-start="10" data-duration="2" data-media-start="0" data-track-index="0"></video>
        <video id="v05" class="clip shot" src="assets/clips4/a05-low-tackle.mp4" muted playsinline data-start="12" data-duration="2" data-media-start="0" data-playback-rate="0.83" data-track-index="0"></video>
        <video id="v06" class="clip shot" src="assets/clips4/a13-low-tackle2.mp4" muted playsinline data-start="14" data-duration="2" data-media-start="0" data-playback-rate="0.83" data-track-index="0"></video>
        <video id="v07" class="clip shot" src="assets/clips4/a17-drone2.mp4" muted playsinline data-start="16" data-duration="2" data-media-start="0.5" data-track-index="0"></video>
        <video id="v08" class="clip shot" src="assets/clips4/a02-gk-save.mp4" muted playsinline data-start="18" data-duration="2" data-media-start="0" data-playback-rate="0.66" data-track-index="0"></video>
        <video id="v09" class="clip shot" src="assets/clips4/a14-gk-save3.mp4" muted playsinline data-start="20" data-duration="2" data-media-start="0" data-playback-rate="0.66" data-track-index="0"></video>
        <video id="v10" class="clip shot" src="assets/clips4/a15-goal-net.mp4" muted playsinline data-start="22" data-duration="2" data-media-start="0" data-playback-rate="0.75" data-track-index="0"></video>
        <video id="v11" class="clip shot" src="assets/clips4/a16-cele3.mp4" muted playsinline data-start="24" data-duration="2" data-media-start="2.15" data-track-index="0"></video>
        <video id="v12" class="clip shot" src="assets/clips4/a06-gk-save2.mp4" muted playsinline data-start="26" data-duration="2" data-media-start="0.2" data-playback-rate="0.75" data-track-index="0"></video>
        <video id="v13" class="clip shot" src="assets/clips4/a10-goal-tele.mp4" muted playsinline data-start="28" data-duration="2" data-media-start="0" data-playback-rate="0.83" data-track-index="0"></video>
        <!-- the hero goal: the ball crosses the line at 38.0 -->
        <video id="v14" class="clip shot" src="assets/clips4/a07-hero-run.mp4" muted playsinline data-start="30" data-duration="2.48" data-media-start="0.45" data-track-index="0"></video>
        <video id="v15" class="clip shot" src="assets/clips4/s2-strike.mp4" muted playsinline data-start="32.48" data-duration="2.58" data-media-start="0" data-track-index="0"></video>
        <video id="v16" class="clip shot" src="assets/clips4/s3-ballflight.mp4" muted playsinline data-start="35.06" data-duration="1.44" data-media-start="0" data-track-index="0"></video>
        <video id="v17" class="clip shot" src="assets/clips4/s4-net.mp4" muted playsinline data-start="36.5" data-duration="2.19" data-media-start="0" data-track-index="0"></video>
        <video id="v18" class="clip shot" src="assets/clips4/a08-hero-cele.mp4" muted playsinline data-start="38.69" data-duration="3.31" data-media-start="1.6" data-track-index="0"></video>
        <video id="v19" class="clip shot" src="assets/clips4/a11-cele2.mp4" muted playsinline data-start="42" data-duration="2.5" data-media-start="0.6" data-track-index="0"></video>
        <video id="v20" class="clip shot" src="assets/clips4/a12-chase-run2.mp4" muted playsinline data-start="44.5" data-duration="3" data-media-start="0" data-track-index="0"></video>
        <!-- end card bed -->
        <video id="v21" class="clip shot blurbg" src="assets/clips4/a08-hero-cele.mp4" muted playsinline data-start="47.5" data-duration="12.5" data-media-start="0" data-playback-rate="0.4" data-track-index="0"></video>
      </div>

      <div id="vignette" class="clip layer" data-start="0" data-duration="60" data-track-index="1"></div>
      <div id="scrim" class="clip layer" data-start="0" data-duration="47.5" data-track-index="2"></div>

      <div id="cards" class="clip layer" data-start="0" data-duration="47.5" data-track-index="3" data-layout-allow-overflow>
        <div id="why" class="layer cc C"><div class="ln P" style="font-size: 150px">why we play</div></div>
        <div id="c1" class="layer cc C"><div class="ln P">play 7v7</div></div>
        <div id="c2" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">7v7</span><span class="X">for nutmegs</span><span class="X">gegenpressing</span></div></div></div>
        <div id="c3" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">gegenpressing</div></div></div>
        <div id="c4" class="layer cc C"><div class="ln P" style="font-size: 150px">play tiki-taka</div></div>
        <div id="c5" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">tiki-taka</span><span class="X">to challenge</span><span class="X">to score</span></div></div></div>
        <div id="c6" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">to score</div></div></div>
        <div id="c7" class="layer cc B"><div class="pl P">play</div><div class="win"><div class="col"><span class="X">to score</span><span class="X">together</span><span class="X">for glory</span></div></div></div>
        <div id="c8" class="layer cc C"><div class="ln P" style="font-size: 140px">play for glory</div></div>
        <div id="c9" class="layer cc A"><div class="pl P">play</div><div class="rsw"><div class="rs P">for football</div></div></div>
      </div>

      <div id="end" class="clip layer" data-start="47.5" data-duration="12.5" data-track-index="3">
        <img id="e-art" src="assets/img/hero.webp" alt="" />
        <div id="e-tag"><div class="K">compete. score. dominate.</div></div>
        <div id="e-btn" class="playbtn"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#ffffff" /></svg><div class="P">play</div></div>
        <div id="e-foot"><div class="K">7v7 · season 01 · in your browser</div></div>
      </div>

      <div id="flash" class="clip layer" data-start="0" data-duration="60" data-track-index="4"></div>
      <div id="lflash" class="clip layer" data-start="37" data-duration="3" data-track-index="4"></div>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="60" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const IMPACT = 38;
      gsap.set("#stage", { x: 0, y: 0, scale: 1 });
      gsap.set(["#why", "#c1", "#c2", "#c3", "#c4", "#c5", "#c6", "#c7", "#c8", "#c9"], { opacity: 0 });

      // tracking moves as per-glyph x offsets, never as letter-spacing
      function glyphs(sel) {
        const el = document.querySelector(sel), text = el.textContent;
        el.textContent = "";
        for (const ch of text) {
          const g = document.createElement("span");
          g.style.display = "inline-block";
          g.textContent = ch === " " ? " " : ch;
          el.appendChild(g);
        }
        return Array.from(el.children);
      }
      function track(sel, spread, t, d, ease) {
        const gs = glyphs(sel), c = (gs.length - 1) / 2;
        tl.fromTo(gs, { x: (i) => (i - c) * spread }, { x: 0, duration: d, ease: ease }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: Math.min(0.4, d), ease: "power1.out" }, t);
      }

      // every shot keeps moving: slow push-in per cut
      [[0, 4], [4, 2], [6, 2], [8, 2], [10, 2], [12, 2], [14, 2], [16, 2], [18, 2], [20, 2], [22, 2], [24, 2], [26, 2], [28, 2],
       [30, 2.48], [32.48, 2.58], [35.06, 1.44], [36.5, 2.19], [38.69, 3.31], [42, 2.5], [44.5, 3]].forEach(([t, d]) => {
        tl.fromTo("#stage", { scale: 1 }, { scale: 1.06, duration: d, ease: "none", immediateRender: false }, t);
      });
      tl.fromTo("#stage", { scale: 1.15 }, { scale: 1.05, duration: 12.5, ease: "none", immediateRender: false }, 47.5);

      // a quick white kiss on the cuts that land on a card
      [6, 10, 12, 16, 18, 22, 24, 30].forEach((t) => tl.fromTo("#flash", { opacity: 0.22 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t));

      const show = (id, t, d) => {
        tl.set(id, { opacity: 1 }, t); tl.set(id, { opacity: 0 }, t + d);
        tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t);
        tl.to("#scrim", { opacity: 0, duration: 0.25 }, t + d - 0.25);
      };
      const cardA = (id, t, d) => {
        show(id, t, d);
        tl.fromTo(id + " .pl", { scale: 1.25, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, t + 0.02);
        tl.fromTo(id + " .rs", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, t + 0.15);
        tl.to(id + " .pl", { scale: 0.96, duration: d - 0.4, ease: "none" }, t + 0.37);
        tl.to(id, { opacity: 0, duration: 0.18 }, t + d - 0.2);
      };
      const cardB = (id, t, d, steps) => {
        show(id, t, d);
        tl.fromTo(id + " .pl", { xPercent: -30, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, t + 0.02);
        tl.fromTo(id + " .col", { y: 96 }, { y: 96, duration: 0.01 }, t);
        steps.forEach(([at, idx]) => tl.to(id + " .col", { y: 96 * (1 - idx), duration: 0.42, ease: "expo.out" }, t + at));
        tl.to(id, { opacity: 0, duration: 0.18 }, t + d - 0.2);
      };
      const cardC = (id, t, d) => {
        show(id, t, d);
        track(id + " .ln", 70, t + 0.02, d - 0.3, "power3.out");
        tl.to(id, { opacity: 0, duration: 0.18 }, t + d - 0.2);
      };

      // WHY WE PLAY over the kickoff orbit
      show("#why", 0.8, 3);
      track("#why .ln", 40, 0.8, 2.6, "power2.out");
      tl.to("#why", { opacity: 0, duration: 0.3 }, 3.5);

      cardC("#c1", 6, 1.6);
      cardB("#c2", 10, 1.6, [[0.18, 1]]);
      cardA("#c3", 12, 1.6);
      cardC("#c4", 16, 1.6);
      cardB("#c5", 18, 1.6, [[0.18, 1]]);
      cardA("#c6", 22, 1.6);
      cardB("#c7", 24, 1.6, [[0.18, 1]]);
      cardC("#c8", 42, 1.6);
      cardA("#c9", 44.7, 2.6);

      // the goal: the ball hits the net on the bar
      function impact(t, s) {
        tl.fromTo("#flash", { opacity: 0.85 * s }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#stage", { x: 0, y: 0 }, { immediateRender: false, keyframes: [
          { x: -26 * s, y: 18 * s, duration: 0.04 }, { x: 22 * s, y: -14 * s, duration: 0.05 },
          { x: -12 * s, y: 8 * s, duration: 0.06 }, { x: 0, y: 0, duration: 0.12 }], ease: "none" }, t);
      }
      impact(IMPACT, 1);
      tl.fromTo("#lflash", { opacity: 0.7 }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, IMPACT);
      impact(38.69, 0.4);

      // end card
      tl.fromTo("#e-art", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 47.5);
      tl.to("#e-art", { scale: 1.05, duration: 12.1, ease: "none" }, 47.9);
      track("#e-tag .K", 14, 48.5, 1.2, "power3.out");
      tl.fromTo("#e-btn", { opacity: 0, scale: 0.6, skewX: -6 }, { opacity: 1, scale: 1, skewX: -6, duration: 0.4, ease: "back.out(2.2)" }, 49.5);
      for (let t = 51; t < 59.5; t += 1) tl.fromTo("#e-btn", { scale: 1.06 }, { scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
      tl.fromTo("#e-foot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 50.5);
      tl.to("#end", { opacity: 0, duration: 1.2, ease: "power1.in" }, 58.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
